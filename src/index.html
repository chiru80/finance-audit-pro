<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Finance Audit Pro — Collections &amp; Audit</title>
  <meta name="description" content="A precise, elegant financial operations workspace for customer collections, audit-ready ledgers, and reporting.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('finance-audit-pro-theme');
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) {
          root.setAttribute('data-theme', 'dark');
          root.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101116');
        } else {
          root.removeAttribute('data-theme');
          root.classList.remove('dark');
        }
      } catch {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="font-sans antialiased min-h-screen">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
