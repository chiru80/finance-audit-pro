<!doctype html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="utf-8">
  <title>Finance Audit Pro - Audit Engine</title>
  <meta name="description" content="Finance Audit Pro is an audit-safe weekly collection ledger for a single owner. Track customers, weekly dues, collections, absences, and reports in English or Telugu.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function(){try{var t=localStorage.getItem('finance-audit-pro-theme');var d=document.documentElement;if(t==='light'){d.removeAttribute('data-theme');d.classList.remove('dark');}else{d.setAttribute('data-theme','dark');d.classList.add('dark');}}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="font-sans antialiased min-h-screen">
  <div id="app-loader">
    <div class="rl-coin">₹</div>
    <div class="rl-bar"></div>
  </div>
  <style>
    #app-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #0f172a; }
    .rl-coin { font-size: 5rem; font-weight: 800; color: #2563eb; text-shadow: 0 0 28px rgba(37,99,235,0.5); animation: rl-flip 1.6s cubic-bezier(0.4,0,0.2,1) infinite; transform-style: preserve-3d; }
    .rl-bar { width: 8rem; height: 3px; border-radius: 9999px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .rl-bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 9999px; background: #2563eb; animation: rl-slide 1.2s ease-in-out infinite; }
    @keyframes rl-flip { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.05); } 100% { transform: rotateY(360deg) scale(1); } }
    @keyframes rl-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
